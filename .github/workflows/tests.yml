name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # No Wyscout data is downloaded here. Tests that need the local shot table, the cached
      # Figshare archive, or the built processed data skip themselves when those are absent
      # (see docs/REPRODUCIBILITY.md); only the offline, synthetic-fixture tests run in CI.
      - name: Run tests
        run: uv run pytest -q
