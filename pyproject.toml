[project]
name = "expected-goals-lab"
version = "0.1.0"
description = "Transparent expected-goals research on Wyscout open event data: a one-season, five-league study."
readme = "README.md"
authors = [
    { name = "Aiden Poswell" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
